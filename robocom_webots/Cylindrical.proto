PROTO Cylindrical [
  field SFVec3f     translation   0 0 0.015
  field SFRotation  rotation      0 0 1 0
  field SFString    name          "Cylindrical"
  field SFBool      castShadows   FALSE
  field SFColor     color         1.0 1.0 0.0
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      DEF cylindricalb Shape {
        appearance Appearance {
          material Material {
            diffuseColor IS color
          }
        }
        geometry Mesh {
          url [
            "./shapes/cylindrical.STL"
          ]
        }
        castShadows IS castShadows
      }
    ]
    boundingObject USE cylindricalb
    physics Physics {
      density -1
      mass 0.01
    }
  }
}
