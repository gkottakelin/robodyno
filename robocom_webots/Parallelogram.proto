PROTO Parallelogram [
  field SFVec3f     translation   0 0 0.015
  field SFRotation  rotation      0 0 1 0
  field SFString    name          "Parallelogram"
  field SFBool      castShadows   FALSE
  field SFColor     color         0.0 0.3 1.0
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      DEF parallelogramb Shape {
        appearance Appearance {
          material Material {
            diffuseColor IS color
          }
        }
        geometry Mesh {
          url [
            "./shapes/parallelogram.STL"
          ]
        }
        castShadows IS castShadows
      }
    ]
    boundingObject USE parallelogramb
    physics Physics {
      density -1
      mass 0.01
    }
  }
}
