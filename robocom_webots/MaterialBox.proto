PROTO MaterialBox [
  field SFVec3f     translation   0 0 0.01
  field SFRotation  rotation      0 0 1 0
  field SFString    name          "MaterialBox"
  field SFBool      castShadows   FALSE
  field SFBool      locked        TRUE
  field SFColor     color         0.8 0.8 0.8
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    locked IS locked
    children [
      DEF mbox Shape {
        appearance Appearance {
          material Material {
            diffuseColor IS color
          }
        }
        geometry Mesh {
          url [
            "./shapes/MaterialBox.STL"
          ]
        }
        castShadows IS castShadows
      }
    ]
    boundingObject Pose {
      translation 0 0 0.0053
      children [
        Box {
          size 0.135 0.07 0.01
        }
      ]
    }
  }
}
