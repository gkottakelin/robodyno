PROTO FivePointed [
  field SFVec3f     translation   0 0 0.015
  field SFRotation  rotation      0 0 1 0
  field SFString    name          "FivePointed"
  field SFBool      castShadows   FALSE
  field SFColor     color         1.0 0.3 0.5
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      DEF five_pointedb Shape {
        appearance Appearance {
          material Material {
            diffuseColor IS color
          }
        }
        geometry Mesh {
          url [
            "./shapes/five_pointed.STL"
          ]
        }
        castShadows IS castShadows
      }
    ]
    boundingObject Pose {
      translation 0 0 0.0075
      children [
        Cylinder {
          height 0.015
          radius 0.022
        }
      ]
    }
    physics Physics {
      density -1
      mass 0.01
      damping Damping {
        linear 0.35
        angular 0.8
      }
    }
  }
}
