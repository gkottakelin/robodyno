PROTO Cuboid [
  field SFVec3f     translation   0 0 0.015
  field SFRotation  rotation      0 0 1 0
  field SFString    name          "Cuboid"
  field SFBool      castShadows   FALSE
  field SFColor     color         1.0 0.0 0.0
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      DEF cuboidb Shape {
        appearance Appearance {
          material Material {
            diffuseColor IS color
          }
        }
        geometry Mesh {
          url [
            "./shapes/cuboid.STL"
          ]
        }
        castShadows IS castShadows
      }
    ]
    boundingObject USE cuboidb
    physics Physics {
      density -1
      mass 0.01
      damping Damping {
        linear 0.35
        angular 0.8
      }
    }
  }
}
