PROTO Triangle [
  field SFVec3f     translation   0 0 0.015
  field SFRotation  rotation      0 0 1 0
  field SFString    name          "Triangle"
  field SFBool      castShadows   FALSE
  field SFColor     color         1.0 0.4 0.4
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      DEF triangleb Shape {
        appearance Appearance {
          material Material {
            diffuseColor IS color
          }
        }
        geometry Mesh {
          url [
            "./shapes/triangle.STL"
          ]
        }
        castShadows IS castShadows
      }
    ]
    boundingObject USE triangleb
    physics Physics {
      density -1
      mass 0.01
    }
  }
}
